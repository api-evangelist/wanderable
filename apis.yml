name: Wanderable
description: Wanderable was a honeymoon and experience gift registry startup founded in 2012 by Stanford
  classmates Jenny Chen and Marcela Miyazawa, backed by the 500 Startups (500 Global) accelerator and its
  500 Women Syndicate. Couples could register for honeymoon experiences and travel rather than physical
  goods, fund trips online and via an iPhone app, and manage registries and thank-you notes on the go. The
  company ceased operating its registry service in Summer 2022 and now directs former users to Traveler's
  Joy. It exposes no public developer, API, or discovery surface.
